# golangci-lint v2 configuration, based on the config Guardrails bundles.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: receiver-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      # Probabilistic shedding needs a fast PRNG on the request path, not a
      # cryptographic one; nothing security-sensitive depends on it.
      - path: ^brownout\.go$
        linters: [gosec]
        text: G404
      # FileSource reads the rules file at a path the caller chose.
      - path: ^file\.go$
        linters: [gosec]
        text: G304
      # Examples log request details to demonstrate the OnShed hook.
      - path: ^examples/
        linters: [gosec]
        text: G706

formatters:
  enable:
    - gofumpt
    - goimports
