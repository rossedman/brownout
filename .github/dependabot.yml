version: 2
updates:
  # The library has no dependencies outside the standard library today; this
  # keeps any that are added later up to date.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go-modules:
        patterns: ["*"]

  # Actions used by .github/workflows (checkout, setup-go, Pages, ...),
  # grouped into one weekly pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
