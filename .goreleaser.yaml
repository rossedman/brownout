# GoReleaser configuration. brownout is a library consumed with `go get`, so
# releases ship no binaries: each v* tag gets a GitHub release with notes
# grouped by Conventional Commit type, a source archive, and a checksums file
# signed keylessly with cosign (see SECURITY.md for how to verify it).
#
#   goreleaser check                                   # validate this file
#   goreleaser release --snapshot --clean --skip=sign  # local dry run into dist/
#
# .github/workflows/release.yml runs it for every v* tag.
version: 2

project_name: brownout

builds:
  - skip: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^build\\(deps\\):"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999

release:
  github:
    owner: rossedman
    name: brownout
  prerelease: auto
  mode: replace
  header: |
    ## brownout {{ .Tag }}

    ```sh
    go get github.com/rossedman/brownout@{{ .Tag }}
    ```
  footer: |
    **Full changelog**: https://github.com/rossedman/brownout/compare/{{ .PreviousTag }}...{{ .Tag }}
