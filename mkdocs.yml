# The docs site: the landing page (overrides/home.html) and every page in docs/.
# Published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally: make docs-serve
site_name: brownout
site_description: Go HTTP middleware that sheds traffic to chosen routes at runtime, with no restart and no deploy.
site_url: https://rossedman.io/brownout/
repo_url: https://github.com/rossedman/brownout
repo_name: rossedman/brownout
edit_uri: edit/master/docs/

# Graphic sources and their render script are not pages.
exclude_docs: |
  /assets/src/
  /assets/render.sh

theme:
  name: material
  custom_dir: overrides
  logo: assets/site/logo.svg
  favicon: assets/site/favicon.svg
  palette:
    scheme: slate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/site/landing.css
  - assets/site/docs.css
  - assets/site/playground.css
extra_javascript:
  - assets/site/landing.js
  - assets/site/docs.js
  - assets/site/playground.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Fail the build when an included root file is missing.
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Strict builds fail on broken links and #anchors between pages.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Guides:
      - Rules: rules.md
      - Changing rules: changing-rules.md
      - Customizing responses: customizing.md
      - Running in production: production.md
      - Examples: examples.md
  - Playground: playground.md
  - Reference:
      - Performance: performance.md
      - API on pkg.go.dev: https://pkg.go.dev/github.com/rossedman/brownout
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Releases: https://github.com/rossedman/brownout/releases

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/brownout
      name: brownout on GitHub
    - icon: fontawesome/brands/golang
      link: https://pkg.go.dev/github.com/rossedman/brownout
      name: API reference on pkg.go.dev
  generator: false
